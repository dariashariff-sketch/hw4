<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Bulldog in a cream sherpa fleece jacket">
  <title>Bulldog in a cream sherpa fleece jacket</title>
  <rect width="200" height="200" rx="24" fill="#e3ebf5"/>
  <circle cx="100" cy="104" r="84" fill="#fff" opacity=".55"/>
  <circle cx="34" cy="34" r="4" fill="#ffffff"/><circle cx="168" cy="44" r="3" fill="#ffffff"/><circle cx="160" cy="26" r="2" fill="#2a5a8f"/>

  <path d="M40 200 C40 156 60 126 100 124 C140 126 160 156 160 200 Z" fill="#f3ead8" stroke="#2b1d14" stroke-width="2.5"/>
  <circle cx="52" cy="166" r="3.2" fill="#d9cdb4" opacity=".75"/><circle cx="62" cy="150" r="3.2" fill="#d9cdb4" opacity=".75"/><circle cx="48" cy="186" r="3.2" fill="#d9cdb4" opacity=".75"/><circle cx="92" cy="176" r="3.2" fill="#d9cdb4" opacity=".75"/><circle cx="148" cy="166" r="3.2" fill="#d9cdb4" opacity=".75"/><circle cx="138" cy="150" r="3.2" fill="#d9cdb4" opacity=".75"/><circle cx="152" cy="186" r="3.2" fill="#d9cdb4" opacity=".75"/><circle cx="108" cy="186" r="3.2" fill="#d9cdb4" opacity=".75"/><circle cx="82" cy="146" r="3.2" fill="#d9cdb4" opacity=".75"/><circle cx="118" cy="146" r="3.2" fill="#d9cdb4" opacity=".75"/><circle cx="94" cy="160" r="3.2" fill="#d9cdb4" opacity=".75"/><circle cx="106" cy="162" r="3.2" fill="#d9cdb4" opacity=".75"/>
  <!-- big fleece collar -->
  <path d="M44 108 Q46 140 97 142 L97 130 Q64 128 56 104 Z" fill="#f3ead8" stroke="#2b1d14" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M156 108 Q154 140 103 142 L103 130 Q136 128 144 104 Z" fill="#f3ead8" stroke="#2b1d14" stroke-width="2.2" stroke-linejoin="round"/>
  
  <!-- floppy rose ears -->
  <path d="M62 56 Q40 46 26 60 Q30 66 40 66 Q46 80 54 74 Z" fill="#b9824a" stroke="#2b1d14" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M138 56 Q160 46 174 60 Q170 66 160 66 Q154 80 146 74 Z" fill="#b9824a" stroke="#2b1d14" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- wide, flat head with droopy jowls -->
  <path d="M100 46 C140 46 162 60 164 84 C166 102 158 114 146 120 C140 130 126 134 112 130 Q100 134 88 130
           C74 134 60 130 54 120 C42 114 34 102 36 84 C38 60 60 46 100 46 Z"
        fill="#d9a066" stroke="#2b1d14" stroke-width="2.5"/>
  <!-- white blaze + muzzle -->
  <path d="M93 48 Q100 46 107 48 L110 88 Q100 92 90 88 Z" fill="#f6e6cf"/>
  <path d="M64 106 C64 92 82 88 100 90 C118 88 136 92 136 106 C136 122 122 130 112 128 Q100 132 88 128 C78 130 64 122 64 106 Z" fill="#f6e6cf"/>
  <!-- forehead wrinkles -->
  <path d="M78 62 Q88 57 96 62 M104 62 Q112 57 122 62" stroke="#b9824a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M84 54 Q91 51 96 54 M104 54 Q109 51 116 54" stroke="#b9824a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- wide-set eyes -->
  <circle cx="72" cy="82" r="7.5" fill="#2b1d14"/><circle cx="128" cy="82" r="7.5" fill="#2b1d14"/>
  <circle cx="74.5" cy="79.5" r="2.6" fill="#fff"/><circle cx="130.5" cy="79.5" r="2.6" fill="#fff"/>
  <!-- blush -->
  <ellipse cx="56" cy="102" rx="7" ry="4" fill="#f2a0a0" opacity=".55"/>
  <ellipse cx="144" cy="102" rx="7" ry="4" fill="#f2a0a0" opacity=".55"/>
  <!-- the classic bulldog nose roll -->
  <path d="M80 92 Q100 80 120 92" stroke="#b9824a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- short pushed-up nose -->
  <path d="M86 96 Q100 90 114 96 Q114 105 100 107 Q86 105 86 96 Z" fill="#2b1d14"/>
  <ellipse cx="94" cy="96" rx="3.5" ry="1.6" fill="#fff" opacity=".5"/>
  <path d="M100 107 L100 111" stroke="#2b1d14" stroke-width="2.5" stroke-linecap="round"/>
  <!-- droopy flews -->
  <path d="M76 113 Q88 115 100 111 Q112 115 124 113" stroke="#2b1d14" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- happy underbite smile -->
  <path d="M78 114 Q100 138 122 114 Q100 122 78 114 Z" fill="#7a3b3b"/>
  <path d="M78 114 Q100 138 122 114" stroke="#2b1d14" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <rect x="86" y="118" width="5" height="6" rx="1.5" fill="#fff" stroke="#2b1d14" stroke-width="1.2"/>
  <rect x="109" y="118" width="5" height="6" rx="1.5" fill="#fff" stroke="#2b1d14" stroke-width="1.2"/>

  <!-- full zip with navy trim -->
  <path d="M100 132 L100 200" stroke="#00356b" stroke-width="7"/>
  <path d="M100 132 L100 200" stroke="#c9d3df" stroke-width="1.5" stroke-dasharray="2 2"/>
  <rect x="95.5" y="138" width="9" height="13" rx="3" fill="#00254a" stroke="#2b1d14" stroke-width="1.6"/>
  
  <path d="M58 148 Q54 170 60 186 L89 186 Q93 168 88 150 Z" fill="#f3ead8" stroke="#2b1d14" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M142 148 Q146 170 140 186 L111 186 Q107 168 112 150 Z" fill="#f3ead8" stroke="#2b1d14" stroke-width="2.5" stroke-linejoin="round"/>

  <g fill="#d9cdb4" opacity=".75"><circle cx="66" cy="160" r="3"/><circle cx="80" cy="170" r="3"/><circle cx="120" cy="160" r="3"/><circle cx="134" cy="170" r="3"/></g>
  
  <rect x="59" y="176" width="30" height="10" rx="3" fill="#00356b" stroke="#2b1d14" stroke-width="2"/>
  <rect x="111" y="176" width="30" height="10" rx="3" fill="#00356b" stroke="#2b1d14" stroke-width="2"/>

  
  <ellipse cx="74" cy="188" rx="15" ry="9" fill="#d9a066" stroke="#2b1d14" stroke-width="2.5"/>
  <ellipse cx="126" cy="188" rx="15" ry="9" fill="#d9a066" stroke="#2b1d14" stroke-width="2.5"/>
  <path d="M69 184 L69 191 M74 183 L74 192 M79 184 L79 191 M121 184 L121 191 M126 183 L126 192 M131 184 L131 191"
        stroke="#b9824a" stroke-width="1.6" stroke-linecap="round"/>


</svg>
